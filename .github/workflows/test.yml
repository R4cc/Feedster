name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Feedster.Web/package-lock.json
      - run: npm ci --prefix Feedster.Web
      - run: dotnet build Feedster.sln --configuration Release
      - run: dotnet test Feedster.sln --configuration Release --no-build
